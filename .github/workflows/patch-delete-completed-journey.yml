name: Patch completed journey deletion

on:
  push:
    branches:
      - feature/delete-completed-journey

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Telegram journey deletion flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/integrations/supabase/telegram.server.ts')
          text = path.read_text()

          old = """      [{ text: 'ENTREGAS' }, { text: 'ADICIONAR JORNADA' }],\n      [{ text: 'REABRIR DIA' }, { text: 'VOLTAR' }]"""
          new = """      [{ text: 'ENTREGAS' }, { text: 'ADICIONAR JORNADA' }],\n      [{ text: 'EXCLUIR JORNADA' }, { text: 'REABRIR DIA' }],\n      [{ text: 'VOLTAR' }]"""
          assert old in text, 'correctionMenu target not found'
          text = text.replace(old, new, 1)

          old = """      const summary = await getSummary(activeDay);\n      await send(summary, activeDay.status === 'completed' ? { keyboard: [[{ text: 'CORRIGIR DIA' }, { text: 'LIMPAR CHAT' }], [{ text: 'MENU' }]], resize_keyboard: true } : mainMenu);"""
          new = """      const summary = await getSummary(activeDay);\n      await send(summary, activeDay.status === 'completed' ? { keyboard: [[{ text: 'CORRIGIR DIA' }, { text: 'EXCLUIR JORNADA' }], [{ text: 'LIMPAR CHAT' }], [{ text: 'MENU' }]], resize_keyboard: true } : mainMenu);"""
          assert old in text, 'completed summary menu target not found'
          text = text.replace(old, new, 1)

          old = """  if (textInput === 'CANCELAR' || textInput === 'VOLTAR') {\n    // Reset correction state if any\n    if (activeDay?.notes?.includes('CORRECT:') || activeDay?.notes?.includes('AWAITING:') || activeDay?.notes?.includes('ADDSESSION:')) {"""
          new = """  if (textInput === 'CANCELAR' || textInput === 'VOLTAR') {\n    // Reset correction/deletion state if any\n    if (activeDay?.notes?.includes('CORRECT:') || activeDay?.notes?.includes('AWAITING:') || activeDay?.notes?.includes('ADDSESSION:') || activeDay?.notes?.includes('DELETE_SESSION:')) {"""
          assert old in text, 'cancel state target not found'
          text = text.replace(old, new, 1)

          marker = """  if (textInput === 'HORÁRIO DE INÍCIO' || textInput === 'HORÁRIO DE ENCERRAMENTO') {"""
          insertion = r'''  if (textInput === 'EXCLUIR JORNADA') {
    if (!activeDay) {
      await send('Nenhum dia encontrado para excluir uma jornada.', mainMenu);
      return;
    }

    const { data: sessions, error } = await (supabaseAdmin
      .from('sessions')
      .select('*')
      .eq('work_day_id', activeDay.id)
      .eq('status', 'completed' as any)
      .order('start_time', { ascending: true }) as any);

    if (error) {
      console.error('Failed to load sessions for deletion:', error);
      await send('Não foi possível carregar as jornadas. Tente novamente.', mainMenu);
      return;
    }

    if (!sessions || sessions.length === 0) {
      await send('Não há jornadas encerradas para excluir neste dia.', correctionMenu);
      return;
    }

    if (sessions.length === 1) {
      const session = sessions[0];
      const duration = session.start_time && session.end_time
        ? formatDuration(new Date(session.end_time).getTime() - new Date(session.start_time).getTime())
        : '—';

      await (supabaseAdmin.from('work_days').update({ notes: `DELETE_SESSION:${session.id}` }).eq('id', activeDay.id) as any);
      await send(
        `<b>EXCLUIR JORNADA?</b>\n\n` +
        `Início: ${formatDateTimeBR(session.start_time)}\n` +
        `Fim: ${session.end_time ? formatDateTimeBR(session.end_time) : '—'}\n` +
        `Duração: ${duration}\n\n` +
        `Esta jornada será removida e deixará de ser contabilizada.\n\n` +
        `<b>Deseja realmente excluir?</b>`,
        {
          keyboard: [[{ text: 'SIM, EXCLUIR JORNADA' }], [{ text: 'NÃO, EXCLUIR' }]],
          resize_keyboard: true
        }
      );
      return;
    }

    const sessionButtons = sessions.map((session: any, index: number) => [{
      text: `JORNADA ${index + 1} — ${formatTimeBR(session.start_time)}`
    }]);
    await (supabaseAdmin.from('work_days').update({ notes: 'DELETE_SESSION:SELECT' }).eq('id', activeDay.id) as any);
    await send('Qual jornada você deseja excluir?', {
      keyboard: [...sessionButtons, [{ text: 'VOLTAR' }]],
      resize_keyboard: true
    });
    return;
  }

  if (activeDay?.notes?.startsWith('DELETE_SESSION:') && textInput.startsWith('JORNADA ')) {
    const { data: sessions } = await (supabaseAdmin
      .from('sessions')
      .select('*')
      .eq('work_day_id', activeDay.id)
      .eq('status', 'completed' as any)
      .order('start_time', { ascending: true }) as any);

    const match = textInput.match(/^JORNADA (\d+)/);
    const index = match ? parseInt(match[1]!, 10) - 1 : -1;
    const session = sessions?.[index];

    if (!session) {
      await send('Selecione uma jornada válida.', correctionMenu);
      return;
    }

    const duration = session.start_time && session.end_time
      ? formatDuration(new Date(session.end_time).getTime() - new Date(session.start_time).getTime())
      : '—';

    await (supabaseAdmin.from('work_days').update({ notes: `DELETE_SESSION:${session.id}` }).eq('id', activeDay.id) as any);
    await send(
      `<b>EXCLUIR JORNADA?</b>\n\n` +
      `Jornada ${index + 1}\n` +
      `Início: ${formatDateTimeBR(session.start_time)}\n` +
      `Fim: ${session.end_time ? formatDateTimeBR(session.end_time) : '—'}\n` +
      `Duração: ${duration}\n\n` +
      `Esta jornada será removida e deixará de ser contabilizada.\n\n` +
      `<b>Deseja realmente excluir?</b>`,
      {
        keyboard: [[{ text: 'SIM, EXCLUIR JORNADA' }], [{ text: 'NÃO, EXCLUIR' }]],
        resize_keyboard: true
      }
    );
    return;
  }

  if (textInput === 'SIM, EXCLUIR JORNADA') {
    if (!activeDay?.notes?.startsWith('DELETE_SESSION:')) {
      await send('Nenhuma exclusão de jornada está pendente.', mainMenu);
      return;
    }

    const sessionId = activeDay.notes.split(':')[1];
    if (!sessionId || sessionId === 'SELECT') {
      await send('Selecione a jornada que deseja excluir primeiro.', correctionMenu);
      return;
    }

    const { data: session, error: fetchError } = await (supabaseAdmin
      .from('sessions')
      .select('*')
      .eq('id', sessionId)
      .eq('work_day_id', activeDay.id)
      .eq('status', 'completed' as any)
      .maybeSingle() as any);

    if (fetchError || !session) {
      await (supabaseAdmin.from('work_days').update({ notes: null }).eq('id', activeDay.id) as any);
      await send('A jornada selecionada não foi encontrada. Nenhuma alteração foi feita.', correctionMenu);
      return;
    }

    const { error } = await (supabaseAdmin
      .from('sessions')
      .delete()
      .eq('id', sessionId)
      .eq('work_day_id', activeDay.id) as any);

    if (error) {
      console.error('Failed to delete completed session:', error);
      await send('Não foi possível excluir a jornada. Nenhum registro foi alterado.', correctionMenu);
      return;
    }

    await (supabaseAdmin.from('work_days').update({ notes: null }).eq('id', activeDay.id) as any);
    const updatedDay = await getActiveWorkDay();
    const remainingSessions = await (supabaseAdmin
      .from('sessions')
      .select('id')
      .eq('work_day_id', activeDay.id)
      .eq('status', 'completed' as any) as any);
    const summary = getSummary(updatedDay);

    await send('<b>JORNADA EXCLUÍDA</b>\n\nA jornada foi removida dos registros e não será contabilizada no tempo trabalhado.', {
      keyboard: [[{ text: 'EXCLUIR JORNADA' }, { text: 'CORRIGIR DIA' }], [{ text: 'RESUMO' }], [{ text: 'MENU' }]],
      resize_keyboard: true
    });
    await send(await summary);
    return;
  }

  if (textInput === 'NÃO, EXCLUIR') {
    if (activeDay?.notes?.startsWith('DELETE_SESSION:')) {
      await (supabaseAdmin.from('work_days').update({ notes: null }).eq('id', activeDay.id) as any);
    }
    await send('Operação cancelada. A jornada permanece registrada.', correctionMenu);
    return;
  }

'''
          assert marker in text, 'correction flow insertion marker not found'
          text = text.replace(marker, insertion + marker, 1)

          path.write_text(text)
          PY

      - name: Commit patched source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/telegram.server.ts .github/workflows/patch-delete-completed-journey.yml
          git rm .github/workflows/patch-delete-completed-journey.yml
          git commit -m "feat: allow deleting completed journeys"
          git push
