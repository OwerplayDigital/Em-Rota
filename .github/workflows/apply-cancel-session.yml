name: Apply cancel active session change

on:
  push:
    branches:
      - feature/cancel-active-session

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply cancel active session change') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/cancel-active-session

      - name: Apply code change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/integrations/supabase/telegram.server.ts')
          text = path.read_text()

          marker = "  if (textInput === 'ENCERRAR JORNADA') {\n"
          if marker not in text:
              raise SystemExit('ENCERRAR JORNADA handler not found')

          insert = '''  if (textInput === 'CANCELAR JORNADA') {\n    if (!activeSession) {\n      await send('Não existe nenhuma jornada em andamento para cancelar.', mainMenu);\n      return;\n    }\n\n    await send(\n      `<b>CANCELAR JORNADA?</b>\\n\\n` +\n      `Esta ação vai excluir a jornada iniciada em ${formatDateTimeBR(activeSession.start_time)}.\\n` +\n      `Ela não será contabilizada no tempo trabalhado nem aparecerá no resumo.\\n\\n` +\n      `<b>Deseja realmente cancelar?</b>`,\n      {\n        keyboard: [[{ text: 'SIM, CANCELAR JORNADA' }, { text: 'NÃO, VOLTAR' }]],\n        resize_keyboard: true\n      }\n    );\n    return;\n  }\n\n  if (textInput === 'SIM, CANCELAR JORNADA') {\n    if (!activeSession) {\n      await send('Não existe nenhuma jornada em andamento para cancelar.', mainMenu);\n      return;\n    }\n\n    const { error } = await (supabaseAdmin\n      .from('sessions')\n      .delete()\n      .eq('id', activeSession.id) as any);\n\n    if (error) {\n      console.error('Failed to cancel active session:', error);\n      await send('Não foi possível cancelar a jornada. Tente novamente.', mainMenu);\n      return;\n    }\n\n    await send('<b>JORNADA CANCELADA</b>\\n\\nA jornada foi removida do registro. Nenhum tempo foi contabilizado.', {\n      keyboard: [[{ text: 'INICIAR JORNADA' }, { text: 'RESUMO' }], [{ text: 'MENU' }]],\n      resize_keyboard: true\n    });\n    return;\n  }\n\n  if (textInput === 'NÃO, VOLTAR') {\n    await send('Operação cancelada. A jornada continua em andamento.', {\n      keyboard: [[{ text: 'ENCERRAR JORNADA' }, { text: 'CANCELAR JORNADA' }], [{ text: 'RESUMO' }], [{ text: 'MENU' }]],\n      resize_keyboard: true\n    });\n    return;\n  }\n\n'''

          text = text.replace(marker, insert + marker, 1)

          old_active_menu = "      keyboard: [[{ text: 'ENCERRAR JORNADA' }, { text: 'RESUMO' }], [{ text: 'LIMPAR CHAT' }]],"
          new_active_menu = "      keyboard: [[{ text: 'ENCERRAR JORNADA' }, { text: 'CANCELAR JORNADA' }], [{ text: 'RESUMO' }], [{ text: 'LIMPAR CHAT' }]],"
          if old_active_menu not in text:
              raise SystemExit('active session menu not found')
          text = text.replace(old_active_menu, new_active_menu, 2)

          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-cancel-session.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/integrations/supabase/telegram.server.ts .github/workflows/apply-cancel-session.yml
          git commit -m 'Apply cancel active session change'
          git push origin feature/cancel-active-session