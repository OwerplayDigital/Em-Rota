name: Apply completed journey deletion
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/integrations/supabase/telegram.server.ts')
          s = p.read_text()
          assert "[{ text: 'ENTREGAS' }, { text: 'ADICIONAR JORNADA' }]" in s
          assert "if (textInput === 'HORÁRIO DE INÍCIO' || textInput === 'HORÁRIO DE ENCERRAMENTO')" in s
          print('patch workflow reached runner')
          PY
